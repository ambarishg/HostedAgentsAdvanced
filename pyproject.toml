[project]
name = "hosted-agent-platform"
version = "0.1.0"
description = "A Foundry hosted agent with an authenticated PostgreSQL persistence API."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-foundry==1.15.0",
    "agent-framework-foundry-hosting==1.0.0b261015",
    "alembic>=1.15,<2",
    "azure-functions>=1.23,<2",
    "azure-identity>=1.24,<2",
    "azure-keyvault-secrets>=4.9,<5",
    "azure-storage-blob>=12.26,<13",
    "certifi>=2025.1",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hosted_agent", "persistence_api", "shared"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/system_prompt.vulnerability.txt" = "prompts/system_prompt.vulnerability.txt"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
